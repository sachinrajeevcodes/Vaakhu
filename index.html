<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAFBFA">
<title>Vaakhu – lexical analysis workbench</title>
<style>
:root{
  --paper:#EDF1EE; --panel:#FAFBFA; --line:#D0D9D3; --line-soft:#E4EAE6;
  --ink:#1D2A39; --muted:#5A6878; --green:#1F6F61; --green-d:#175548;
  --hl:#F3C54A; --hl-soft:#FCEFC4; --danger:#9C2F2F; --radius:6px;
  --font:"Segoe UI",system-ui,-apple-system,"Noto Sans","Nirmala UI","Noto Sans Malayalam",Kartika,Meera,sans-serif;
  --head:Bahnschrift,"DIN Alternate","Barlow Semi Condensed","Segoe UI","Nirmala UI","Noto Sans Malayalam",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
h2,h3{font-family:var(--head)}

/* header */
header.top{display:flex;align-items:center;gap:20px;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.mark{font:600 34px/1.1 "Nirmala UI","Noto Sans Malayalam",Kartika,var(--head);position:relative;padding:0 8px 4px;isolation:isolate}
.mark::before{content:"";position:absolute;inset:40% -3px 6% -5px;background:var(--hl);transform:rotate(-1.6deg);border-radius:3px 9px 4px 10px;z-index:-1}
.brand h1{font:600 20px/1.15 var(--head);margin:0}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status .count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;margin-right:6px}

/* filters */
.filters{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 22px;background:var(--paper);border-bottom:1px solid var(--line)}
.filters label{flex-direction:row;align-items:center;gap:6px}
.filters select{min-width:110px;max-width:220px}
.filters .shown{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* layout */
.shell{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:calc(100vh - 118px)}
nav.side{padding:14px 10px;border-right:1px solid var(--line)}
nav.side button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 12px;border-radius:var(--radius);font-size:14px;position:relative;isolation:isolate}
nav.side button:hover{background:#E1E8E3}
nav.side button.on{font-weight:600}
nav.side button.on::before{content:"";position:absolute;left:7px;right:8px;top:52%;bottom:5px;background:var(--hl);opacity:.85;transform:rotate(-1deg);border-radius:2px 6px 3px 7px;z-index:-1}
nav.side .sep{height:1px;background:var(--line);margin:8px 10px}
main{padding:20px 26px 70px;min-width:0}
.view-head h2{font-size:24px;line-height:1.2;margin:0 0 4px;font-weight:600}
.view-head p{margin:0 0 16px;color:var(--muted);max-width:74ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:0 0 16px}
.panel h3{font-size:16px;line-height:1.3;margin:0 0 8px;font-weight:600}
.panel > h3 + .hint{margin-top:-4px}
.empty{color:var(--muted)}
.empty p{max-width:62ch}

/* controls */
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:6px 12px;font-size:14px}
button:hover:not(:disabled){border-color:#97A99F}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--green);border-color:var(--green);color:#fff}
button.primary:hover:not(:disabled){background:var(--green-d)}
button.danger{color:var(--danger)}
button.link{border:0;background:none;padding:0;color:var(--green);text-decoration:underline;text-underline-offset:2px;font-size:inherit;text-align:left}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input[type=text],input[type=search],input[type=number],input:not([type]),select,textarea{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:6px 9px;font-size:14px;color:var(--ink)}
textarea{width:100%;resize:vertical;line-height:1.7}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
label.block{margin:0 0 10px}
.grid2,.grid3{display:grid;gap:12px 16px;margin:0 0 12px}
.grid2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px;max-width:80ch}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.bar{display:flex;gap:10px 14px;align-items:flex-end;flex-wrap:wrap;margin:0 0 10px}
.bar label{min-width:0}
.spacer{flex:1}
.nojs{padding:28px 22px;max-width:62ch}
.nojs h2{font:600 22px/1.25 var(--head);margin:0 0 10px}
.nojs p{margin:0 0 10px;color:var(--muted)}
.bulk{display:flex;gap:10px;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.seg button{border-radius:999px;padding:5px 14px;background:transparent}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.filepick{display:inline-flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px dashed #9FB0A6;border-radius:var(--radius);background:#fff;color:var(--ink);font-size:14px}
fieldset.cols{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin:0 0 8px;max-height:320px;overflow:auto;background:#fff}
fieldset.cols legend{font-size:13px;color:var(--muted);padding:0 4px}
.colpick{flex-direction:row;align-items:baseline;gap:8px;padding:4px 0;border-bottom:1px solid var(--line-soft);color:var(--ink);font-size:14px}
.colpick .cname{font-weight:600;min-width:180px;max-width:280px}
.colpick .cprev{color:var(--muted);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
details{margin-top:10px}
details summary{cursor:pointer;color:var(--green);font-size:14px}
details .hint{margin-top:8px}

/* tables */
.tablewrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{position:sticky;top:0;z-index:1;background:#F1F4F2;text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.t tbody tr:hover td{background:#F6F9F7}
table.t .num, .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.prev{color:var(--muted);max-width:440px}
td.w{font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:baseline}
.muted{color:var(--muted)}
.sig{color:var(--green);letter-spacing:1px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 10px;margin:2px 4px 2px 0;background:#fff;font-size:14px}
.chip button{border:0;background:none;padding:0 6px;color:var(--muted);font-size:15px;line-height:1}

/* concordance */
.kwic{font-size:15px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;max-height:66vh;overflow:auto}
.kl{display:grid;grid-template-columns:150px minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:baseline;padding:5px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer;line-height:1.75}
.kl:hover{background:#F6F9F7}
.kl .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kl .l{display:flex;justify-content:flex-end;overflow:hidden;white-space:nowrap}
.kl .l span{white-space:pre}
.kl .r{overflow:hidden;white-space:pre;text-overflow:ellipsis}
mark,.node{background:linear-gradient(100deg,transparent 0 2%,var(--hl) 3% 97%,transparent 98%);padding:0 3px;border-radius:2px;color:inherit}
.node{font-weight:600;white-space:nowrap}
mark.near{background:none;border-bottom:2px solid var(--green);padding:0}

/* charts */
svg.chart{display:block;max-width:100%;height:auto;font:12px var(--font);margin:6px 0}
svg.chart .lbl{fill:var(--ink)}
svg.chart .val{fill:var(--muted);font-variant-numeric:tabular-nums}
svg.chart .axis{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:4px 0 0}
.cloud{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;padding:18px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);line-height:1.3}
.cloud button{border:0;background:none;padding:0}
.cloud button:hover{text-decoration:underline}

/* lexicons */
.lexgrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.lexlist button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin:0 0 6px;background:#fff}
.lexlist button.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.lexlist .n{margin-left:auto;color:var(--muted);font-size:12px}
.swatch{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}

/* co-occurrence */
table.heat td.cell{text-align:center;font-variant-numeric:tabular-nums;min-width:58px}
table.heat td.diag{color:var(--muted);font-style:italic}

/* suggestions */
.sg{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.sg .forms{display:flex;flex-wrap:wrap;gap:4px 12px;flex:1}
.sg .forms label{flex-direction:row;align-items:center;gap:4px;color:var(--ink);font-size:14px}

/* dialog */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;width:min(880px,94vw);max-height:90vh;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(29,42,57,.45)}
.dlg-head{display:flex;gap:10px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dlg-head h3{margin:0;font-size:18px}
.dlg-head p{margin:2px 0 0;font-size:13px}
.dlg-body{padding:16px 18px;overflow:auto;max-height:62vh}
.dlg-foot{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
.doctext{white-space:pre-wrap;font-size:16px;line-height:1.8;max-width:78ch}

#ask{width:min(440px,92vw);border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--ink)}
#ask::backdrop{background:rgba(29,42,57,.45)}
.ask{padding:20px}
.ask-msg{margin:0 0 14px;font-size:16px;line-height:1.55}
.ask input{width:100%;margin:0 0 6px}
.ask .actions{justify-content:flex-end}
button.dangerfill{background:var(--danger);border-color:var(--danger);color:#fff}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* coding */
nav.side .navlabel{font-size:12px;color:var(--muted);padding:12px 12px 2px}
.codegrid{display:grid;grid-template-columns:210px minmax(0,1fr) 310px;gap:14px;align-items:start}
.doclist{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.doclist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-soft);border-radius:0;padding:7px 10px;background:#fff}
.doclist button.on{background:var(--hl-soft)}
.doclist .sub{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader{white-space:pre-wrap;font-size:17px;line-height:1.95;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;user-select:text}
.cseg{background:var(--sc);border-bottom:2px solid var(--sb);cursor:pointer;border-radius:2px}
.cseg.multi{border-bottom:3px double var(--sb)}
.cseg.sel{outline:2px solid var(--ink);outline-offset:1px}
.cseg.ess{font-weight:600}
.side-panel .panel{padding:12px 14px;margin-bottom:12px}
.codepick{display:flex;flex-direction:row;align-items:center;gap:8px;padding:3px 0;font-size:14px;color:var(--ink)}
.codepick.child{padding-left:18px}
.codepick kbd{font:12px var(--font);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-left:auto}
.seglist .segi{border-top:1px solid var(--line-soft);padding:8px 4px}
.segi.sel{background:var(--hl-soft)}
.segi blockquote,.ret blockquote{margin:0 0 6px;font-size:14px;line-height:1.7}
.ret blockquote{font-size:15px}
.cchip{display:inline-flex;align-items:center;gap:2px;border-radius:999px;padding:0 4px 0 9px;margin:2px 4px 2px 0;font-size:12px;background:var(--sc);border:1px solid var(--sb);line-height:1.7}
.cchip button{border:0;background:none;padding:0 4px;font-size:13px;line-height:1;color:var(--ink)}
.star{border:0;background:none;padding:0 4px 0 0;font-size:16px;color:#B07D12}
.lines .line{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.lines .ltext{font-size:16px;line-height:1.85;white-space:pre-wrap;user-select:text}
.lines textarea{font-size:13px}
.selbox blockquote{margin:6px 0;padding:6px 10px;background:var(--hl-soft);border-radius:4px;max-height:130px;overflow:auto;font-size:14px}
.ret .ri{padding:10px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.ret .ri:hover{background:#F6F9F7}
.tree button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin:0 0 5px;background:#fff}
.tree button.child{margin-left:18px;width:calc(100% - 18px)}
.tree button.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.tree .n{margin-left:auto;color:var(--muted);font-size:12px}
@media (max-width:1180px){.codegrid{grid-template-columns:190px minmax(0,1fr)}.codegrid .side-panel{grid-column:1/-1}}
@media (max-width:860px){.codegrid{grid-template-columns:1fr}.lines .line{grid-template-columns:1fr}}
/* phones and small tablets */
.mobile-only,.sb-mob,td.c-meta{display:none}
#scrim{display:none}
.icon{width:22px;height:22px;display:block}
.tray-q{font-size:14px;line-height:1.6;background:var(--hl-soft);border-radius:8px;padding:6px 10px;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tray-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.tray-chips::-webkit-scrollbar{display:none}
.tchip{flex:none;border-radius:999px;background:var(--sc);border:1px solid var(--sb);min-height:42px;padding:6px 16px;font-size:15px;white-space:nowrap}
.tray-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
@media (max-width:860px){
  .mobile-only{display:revert}
  body{font-size:16px}
  body.nav-open,body.filters-open{overflow:hidden}
  header.top{position:sticky;top:0;z-index:20;padding:8px 8px 8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));gap:6px;flex-wrap:nowrap}
  .brand{gap:10px;min-width:0;flex:1}
  .desk-brand,.status{display:none}
  .mark{font-size:22px;padding:0 5px 3px}
  .apptitle{font:600 17px/1.2 var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:46px;min-height:46px;padding:0 10px;border-radius:12px;background:#fff;position:relative}
  .iconbtn .badge{position:absolute;top:5px;right:5px;background:var(--green);color:#fff;border-radius:999px;font-size:11px;min-width:18px;line-height:18px;padding:0 5px}
  .shell{display:block;min-height:0}
  nav.side{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);z-index:40;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 10px 28px;transform:translateX(-104%);transition:transform .22s ease;visibility:hidden}
  body.nav-open nav.side{transform:none;visibility:visible;box-shadow:8px 0 28px rgba(29,42,57,.2)}
  nav.side button{min-height:46px;font-size:16px;padding:10px 14px}
  nav.side .navlabel{font-size:13px;padding:14px 14px 4px}
  .navproj{display:block;border-top:1px solid var(--line);margin-top:12px;padding:14px 6px 0}
  .navproj .count{font-size:14px;color:var(--muted);margin:0 0 10px}
  .navproj .actions{margin-top:0}
  .navproj .actions button{flex:1 1 100%}
  #scrim{position:fixed;inset:0;z-index:35;background:rgba(29,42,57,.38)}
  body.nav-open #scrim,body.filters-open #scrim{display:block}
  .filters{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;display:none;flex-direction:column;align-items:stretch;gap:14px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border:0;border-radius:18px 18px 0 0;background:var(--panel);max-height:82vh;overflow-y:auto;box-shadow:0 -10px 28px rgba(29,42,57,.2)}
  body.filters-open .filters{display:flex}
  .filters label{flex-direction:column;align-items:stretch;font-size:14px}
  .filters label.check{flex-direction:row;align-items:center;font-size:16px}
  .filters select{max-width:none;width:100%}
  .filters .shown{margin:0;order:-1;font:600 17px/1.3 var(--head);color:var(--ink)}
  main{padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  body.view-code main{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
  .view-head h2{font-size:21px}
  .view-head p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;cursor:pointer;margin-bottom:12px}
  .view-head p.open{display:block}
  .panel{padding:14px;border-radius:12px;margin-bottom:12px}
  button{min-height:44px;padding:8px 14px;font-size:15px}
  button.link,.cchip button,.chip button,.star{min-height:0}
  .star{font-size:20px;padding:0 8px 0 0}
  input[type=text],input[type=search],input[type=number],input:not([type]),select,textarea{font-size:16px;min-height:46px}
  textarea{min-height:0}
  input[type=checkbox]{width:20px;height:20px}
  .bar{flex-direction:column;align-items:stretch;gap:12px}
  .bar > label,.bar > input{width:100%}
  .bar > label input:not([type=checkbox]),.bar > label select{width:100% !important}
  .bar .spacer{display:none}
  .bar > button,.bar > h3{width:100%}
  .actions > button{flex:1 1 auto}
  .seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .seg::-webkit-scrollbar{display:none}
  .seg button{white-space:nowrap;flex:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .tablewrap{max-height:none}
  table.t th,table.t td{padding:9px 8px}
  table.cards thead{display:none}
  table.cards,table.cards tbody{display:block}
  table.cards tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;padding:12px;border-bottom:1px solid var(--line-soft)}
  table.cards td{display:block;border:0;padding:0}
  table.cards td.c-sel{grid-row:1 / span 3;padding-top:3px}
  table.cards td.c-id{font-weight:600}
  table.cards td.c-words{text-align:right;color:var(--muted);font-size:13px}
  table.cards td.c-meta{display:block;grid-column:2 / -1;font-size:13px;color:var(--muted)}
  table.cards td.c-text{grid-column:2 / -1;max-width:none;font-size:15px}
  table.cards td.c-group,table.cards td.c-item,table.cards td.c-lang,table.cards td.c-mode{display:none}
  .kwic{max-height:none}
  .kl{display:block;padding:12px 14px;line-height:1.8}
  .kl .meta{display:block;margin-bottom:2px}
  .kl .l,.kl .r{display:inline;white-space:normal}
  .kl .l span{white-space:normal}
  .lexgrid{grid-template-columns:1fr}
  .colpick{flex-wrap:wrap}
  .colpick .cname{min-width:0;flex:1}
  .colpick .cprev{flex-basis:100%;padding-left:28px}
  #dlg{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border:0;border-radius:0}
  #dlg[open]{display:flex;flex-direction:column}
  .ask .actions button{flex:1 1 0}
  .dlg-head{padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .dlg-head > div:first-child{flex:1 1 100%}
  .dlg-head button{flex:1 1 auto}
  .dlg-body{flex:1;max-height:none}

        sets = Array.from({length:nSeg}, () => new Array(k).fill(false));

      }

function suggestForms(){
  const freq = new Map(), kind = new Map();
  for (const d of S.docs) {
    prep(d); const lang = langOf(d);
    for (const t of d._tok) {
      if (t.sc === 'n' || S.lemmaMap[t.w] || STOP.has(t.w)) continue;
      freq.set(t.w, (freq.get(t.w) || 0) + 1);
      if (!kind.has(t.w)) kind.set(t.w, t.sc === 'm' ? 'ml' : (lang === 'Manglish' ? 'mg' : 'en'));
    }
  }
  const groups = new Map();

function mergeForms(head, forms){
  head = normalizeText(head).toLowerCase().trim();

  head = S.lemmaMap[head] || head;
  delete S.lemmaMap[head];
  const fs = forms.map(f => normalizeText(f).toLowerCase().trim()).filter(f => f && f !== head);
  for (const f of fs) S.lemmaMap[f] = head;
  for (const k of Object.keys(S.lemmaMap)) if (fs.indexOf(S.lemmaMap[k]) >= 0) S.lemmaMap[k] = head;
  return fs.length;
}

function diverging(items, o){

  const cnt = dim => { const m = {}; for (const d of docs) { const v = dimOf(d, dim); m[v] = (m[v] || 0) + 1; } return Object.keys(m).sort((a, b) => m[b] - m[a]).map(k => [k, m[k]]); };
  const tr = r => '<tr><td>' + (r.label === 'All shown' ? '<strong>All shown</strong>' : '<span class="dot" style="--c:' + colorOf(r.label) + '"></span>' + esc(r.label)) + '</td><td class="num">' + fmt(r.docs) + '</td><td class="num">' + fmt(r.words) + '</td><td class="num">' + fmt(r.types) + '</td><td class="num">' + fmt(r.mean, 1) + '</td><td class="num">' + fmt(r.ttr, 3) + '</td><td class="num">' + (r.sttr === null ? '–' : fmt(r.sttr, 3)) + '</td></tr>';
  const small = (title2, list) => '<div class="panel"><h3>' + title2 + '</h3><table class="t"><tbody>' + list.map(x => '<tr><td>' + esc(x[0]) + '</td><td class="num">' + fmt(x[1]) + '</td><td class="num muted">' + fmt(x[1] / docs.length * 100, 0) + '%</td></tr>').join('') + '</tbody></table></div>';
  return head(title, text) +
    '<div class="panel"><div class="bar" style="align-items:center"><h3 style="margin:0">By group</h3><span class="spacer"></span><button data-act="ov-export">Download CSV</button></div><div class="tablewrap"><table class="t"><thead><tr><th>Group</th><th class="num">Responses</th><th class="num">Words</th><th class="num">Unique words</th><th class="num">Words per response</th><th class="num">Type-token ratio</th><th class="num">STTR (100)</th></tr></thead><tbody>' + rows.map(tr).join('') + tr(all) + '</tbody></table></div>' +
    hbar(rows.map(r => ({label:r.label, v:r.mean, c:colorOf(r.label)})), {label:'Words per response by group'}) + '<p class="hint">Bars show average words per response.</p></div>' +
    '<div class="grid2">' + small('Languages', cnt('lang')) + small('Modes', cnt('mode')) + '</div>' + small('Items', cnt('item'));
};

R.freq = function(){
  const title = 'Word frequency', text = 'How often each word or phrase appears in the responses you are showing. Click a word to read it in context.';
  const docs = filtered(); if (!docs.length) return emptyView(title, text);
  const o = S.ui.freq, n = +o.n || 1, tot = totals(docs), gs = groupsIn(docs), multi = gs.length > 1;
  const q = normalizeText(o.q).toLowerCase().trim();
  const rows = freqTable(docs, n).filter(r => r.f >= (+o.min || 1) && (!q || r.k.indexOf(q) >= 0));
  const per = (f, N) => N ? f / N * 1000 : 0;
  let body = '';
  if (!rows.length) body = '<p class="hint">Nothing matches. Lower the minimum count or clear the filter text.</p>';
  else if (o.show === 'chart') body = hbar(rows.slice(0, 25).map(r => ({label:r.k, v:r.f})), {fmt:v => fmt(v), label:'Top 25 by count'});
  else if (o.show === 'cloud') {
    const top = rows.slice(0, 90), mx = top[0].f;
    body = '<div class="cloud">' + top.slice().sort((a, b) => a.k.localeCompare(b.k)).map((r, i) => '<button data-kwic="' + esc(r.k) + '" style="font-size:' + (13 + 30 * Math.sqrt(r.f / mx)).toFixed(0) + 'px;color:' + (i % 3 === 0 ? 'var(--green)' : 'var(--ink)') + '" title="' + esc(r.k + ': ' + r.f) + '">' + esc(r.k) + '</button>').join('') + '</div>';

      '<div class="tablewrap"><table class="t"><thead><tr>' + (n === 1 ? '<th></th>' : '') + '<th class="num">Rank</th><th>' + (n === 1 ? 'Word' : 'Phrase') + '</th><th class="num">Count</th><th class="num">Per 1,000 words</th><th class="num">Responses</th>' +
      (multi ? gs.map(g => '<th class="num" title="' + esc(g) + ' per 1,000 words"><span class="dot" style="--c:' + colorOf(g) + '"></span>' + esc(trunc(g, 16)) + '</th>').join('') : '') + '</tr></thead><tbody>' +
      shown.map((r, i) => '<tr>' + (n === 1 ? '<td><input type="checkbox" class="frsel" value="' + esc(r.k) + '" aria-label="Select ' + esc(r.k) + '"></td>' : '') + '<td class="num muted">' + (i + 1) + '</td><td class="w"><button class="link" data-kwic="' + esc(r.k) + '">' + esc(r.k) + '</button>' + (n === 1 && S.ui.groupOn && hasForms(r.k) ? ' <span class="muted" title="' + esc(formsOf(r.k).join(', ')) + '">+' + formsOf(r.k).length + ' forms</span>' : '') + '</td>' +
        '<td class="num">' + fmt(r.f) + '</td><td class="num">' + fmt(per(r.f, tot.N), 2) + '</td><td class="num">' + fmt(r.df) + '</td>' +
        (multi ? gs.map(g => '<td class="num">' + fmt(per((r.by && r.by[g]) || 0, tot.g[g]), 2) + '</td>').join('') : '') + '</tr>').join('') +
      '</tbody></table></div>' + (rows.length > shown.length ? '<div class="actions"><button data-act="fr-more">Show 500 more</button><span class="hint" style="margin:0">Showing ' + fmt(shown.length) + ' of ' + fmt(rows.length) + '. The CSV includes all of them.</span></div>' : '');
  }
  return head(title, text) + '<div class="panel"><div class="bar">' +
    '<label>Unit<select id="frN">' + [[1,'Single words'],[2,'Two-word phrases'],[3,'Three-word phrases'],[4,'Four-word phrases']].map(x => '<option value="' + x[0] + '"' + (n === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select></label>' +
    '<label>Minimum count<input type="number" id="frMin" min="1" value="' + (+o.min || 1) + '" style="width:96px"></label>' +
    '<label>Contains<input type="search" id="frQ" value="' + esc(o.q) + '" placeholder="Filter the list"></label>' +
    '<label>Show<select id="frShow"><option value="table"' + (o.show === 'table' ? ' selected' : '') + '>Table</option><option value="chart"' + (o.show === 'chart' ? ' selected' : '') + '>Top 25 chart</option><option value="cloud"' + (o.show === 'cloud' ? ' selected' : '') + '>Word cloud</option></select></label>' +
    '<span class="spacer"></span><button data-act="fr-export">Download CSV</button></div>' +
    '<p class="hint">' + fmt(rows.length) + ' different ' + (n === 1 ? 'words' : 'phrases') + ' in ' + fmt(tot.N) + ' words from ' + fmt(docs.length) + ' responses.' + (S.ui.stopOn ? ' Stopwords are removed.' : '') + (S.ui.groupOn && Object.keys(S.lemmaMap).length ? ' Grouped word forms are counted together.' : '') + (multi && o.show === 'table' ? ' Group columns show uses per 1,000 words in that group.' : '') + '</p>' +

};
function formsOf(head){ return Object.keys(S.lemmaMap).filter(k => S.lemmaMap[k] === head); }
function hasForms(head){ for (const k in S.lemmaMap) if (S.lemmaMap[k] === head) return true; return false; }

R.kwic = function(){
  const ex = examples();
  const title = 'Concordance', text = 'Every occurrence of a word or phrase with the words around it. Use * for any ending (' + esc(ex.mlStem) + ' or ' + esc(ex.stem) + '), ? for one letter, and | between alternatives (' + esc(exAlt(ex)) + '). Click a line to read the full response.';
  const docs = filtered(); if (!docs.length) return emptyView(title, text);
  const o = S.ui.kwic;
  let lines = [], err = '';
  if (o.q.trim()) { try { lines = kwic(docs, o); } catch (e) { err = e.message; } }
  const cmp = (a, b) => a.localeCompare(b, 'ml');
  if (o.sort === 'L1') lines.sort((a, b) => cmp(a.L1, b.L1)); else if (o.sort === 'R1') lines.sort((a, b) => cmp(a.R1, b.R1)); else if (o.sort === 'node') lines.sort((a, b) => cmp(a.N, b.N)); else if (o.sort === 'group') lines.sort((a, b) => cmp(a.d.group || '', b.d.group || ''));
  const gs = groupsIn(docs), tot = totals(docs), byG = {}, dset = new Set();

  const controls = '<div class="panel"><div class="bar">' +
    '<label style="flex:1 1 280px">Search for<input id="kwQ" data-enter="kwic-run" value="' + esc(o.q) + '" placeholder="Word, phrase or pattern"></label>' +
    '<label>Words each side<select id="kwSpan">' + [3,5,7,10,15,20].map(v => '<option' + (+o.span === v ? ' selected' : '') + '>' + v + '</option>').join('') + '</select></label>' +
    '<label>Sort by<select id="kwSort">' + [['doc','Response order'],['group','Group'],['L1','Word to the left'],['R1','Word to the right'],['node','Matched form']].map(x => '<option value="' + x[0] + '"' + (o.sort === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select></label>' +
    '<button class="primary" data-act="kwic-run">Search</button></div>' +
    '<div class="bar"><label style="flex:1 1 220px">Only lines with this word nearby (optional)<input id="kwNear" data-enter="kwic-run" value="' + esc(o.near) + '" placeholder="For example ' + esc(ex.en[1] + ' | ' + ex.mlStem) + '"></label>' +
    '<label>Within<select id="kwNearSpan">' + [2,3,5,8,10].map(v => '<option' + (+o.nearSpan === v ? ' selected' : '') + '>' + v + '</option>').join('') + '</select></label>' +
    '<label class="check" style="margin-bottom:6px"><input type="checkbox" id="kwRegex"' + (o.regex ? ' checked' : '') + '> Regular expression</label></div>' +
    (S.ui.groupOn ? '<p class="hint">Grouped word forms are included, so searching a headword also finds its other forms.</p>' : '') + '</div>';
  if (!o.q.trim()) return head(title, text) + controls;

    (lines.length && gs.length > 1 ? '<p class="hint">' + gs.map(g => '<span class="dot" style="--c:' + colorOf(g) + '"></span>' + esc(g) + ': ' + fmt(byG[g] || 0) + ' (' + fmt(tot.g[g] ? (byG[g] || 0) / tot.g[g] * 1000 : 0, 2) + ' per 1,000 words)').join('&nbsp;&nbsp; ') + '</p>' : '');
  const list = lines.length ? '<div class="kwic">' + lines.slice(0, lim).map((l, idx) => '<div class="kl" data-open="' + l.d.id + '" data-hl="' + esc(o.q) + '" data-near="' + esc(o.near) + '" tabindex="0" title="Open response"><span class="meta"><span class="dot" style="--c:' + colorOf(l.d.group) + '"></span>' + esc(l.d.pid || '–') + '</span><span class="l"><span>' + esc(l.left) + '</span></span><span class="node">' + esc(l.node) + '</span><span class="r">' + esc(l.right) + '</span></div>').join('') + '</div>' +
    (lines.length > lim ? '<div class="actions"><button data-act="kwic-more">Show 500 more</button><span class="hint" style="margin:0">Showing ' + fmt(lim) + ' of ' + fmt(lines.length) + '.</span></div>' : '') : '<p class="hint">No matches. Check the spelling, try a wildcard such as കുടി*, or turn on Group word forms.</p>';

R.colloc = function(){
  const ex = examples();

  const docs = filtered(); if (!docs.length) return emptyView(title, text);
  const o = S.ui.colloc;
  const controls = '<div class="panel"><div class="bar">' +
    '<label style="flex:1 1 240px">Search word<input id="coQ" data-enter="colloc-run" value="' + esc(o.q) + '" placeholder="For example ' + esc(ex.ml[0] + ' | ' + ex.stem) + '"></label>' +
    '<label>Words to the left<select id="coL">' + [0,1,2,3,4,5,8,10].map(v => '<option' + (+o.L === v ? ' selected' : '') + '>' + v + '</option>').join('') + '</select></label>' +
    '<label>Words to the right<select id="coR">' + [0,1,2,3,4,5,8,10].map(v => '<option' + (+o.R === v ? ' selected' : '') + '>' + v + '</option>').join('') + '</select></label>' +
    '<label>Minimum together<input type="number" id="coMin" min="1" value="' + (+o.min || 1) + '" style="width:90px"></label>' +
    '<label>Rank by<select id="coStat">' + [['ld','logDice'],['mi','Mutual information'],['t','T-score'],['ll','Log-likelihood'],['o','Times together']].map(x => '<option value="' + x[0] + '"' + (o.stat === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select></label>' +
    '<button class="primary" data-act="colloc-run">Find collocates</button></div>' +
    '<details><summary>Which statistic should I use?</summary><p class="hint">logDice is stable across corpus sizes and a good default. Mutual information favours rare, exclusive pairs, so read it with a minimum of 3 or more. T-score favours frequent, reliable pairs. Log-likelihood tests whether the pairing is beyond chance: 3.84 is p &lt; .05 and 10.83 is p &lt; .001. With small samples, treat every statistic as a pointer to read the lines, not as proof.</p></details></div>';

  return head(title, text) + controls + '<div class="panel"><div class="bar" style="align-items:center"><h3 style="margin:0">' + fmt(res.nodeF) + ' occurrences of the search word, ' + fmt(res.rows.length) + ' collocates</h3><span class="spacer"></span><button data-act="colloc-export"' + (res.rows.length ? '' : ' disabled') + '>Download CSV</button></div>' +

      rows.map(r => '<tr><td class="w"><button class="link" data-kwic="' + esc(o.q) + '" data-near="' + esc(r.k) + '">' + esc(r.k) + '</button></td><td class="num">' + fmt(r.o) + '</td><td class="num">' + fmt(r.l) + '</td><td class="num">' + fmt(r.r) + '</td><td class="num">' + fmt(r.fc) + '</td><td class="num">' + fmt(r.ld, 2) + '</td><td class="num">' + fmt(r.mi, 2) + '</td><td class="num">' + fmt(r.t, 2) + '</td><td class="num">' + fmt(r.ll, 2) + ' <span class="sig">' + stars(r.ll) + '</span></td></tr>').join('') +
      '</tbody></table></div><p class="hint">Click a collocate to see the lines where both words appear together.</p>' : '<p class="hint">No collocates reach the minimum. Lower it, widen the window or turn off stopword removal.</p>') + '</div>';
};

R.key = function(){
  const title = 'Keyness', text = 'Words one part of the data uses far more (or less) than another, tested with log-likelihood. Use it to compare how groups, languages, questions or modes differ: the words that set one group apart from the rest.';
  const o = S.ui.key, base = filtered(o.dim);
  if (!base.length) return emptyView(title, text);
  const vals = valuesOf(o.dim, base);
  if (vals.indexOf(o.target) < 0) o.target = vals[0] || '';
  if (o.ref && (vals.indexOf(o.ref) < 0 || o.ref === o.target)) o.ref = '';
  const controls = '<div class="panel"><div class="bar">' +
    '<label>Compare by<select id="kyDim">' + Object.keys(DIM_LABEL).map(k => '<option value="' + k + '"' + (o.dim === k ? ' selected' : '') + '>' + DIM_LABEL[k] + '</option>').join('') + '</select></label>' +
    '<label>Target<select id="kyT">' + vals.map(v => '<option' + (v === o.target ? ' selected' : '') + '>' + esc(v) + '</option>').join('') + '</select></label>' +
    '<label>Against<select id="kyRef"><option value="">Everything else</option>' + vals.filter(v => v !== o.target).map(v => '<option' + (v === o.ref ? ' selected' : '') + '>' + esc(v) + '</option>').join('') + '</select></label>' +
    '<label>Minimum count<input type="number" id="kyMin" min="1" value="' + (+o.min || 1) + '" style="width:90px"></label>' +
    '<label>Significance<select id="kyP">' + [[3.84,'p < .05'],[6.63,'p < .01'],[10.83,'p < .001'],[15.13,'p < .0001'],[0,'Show all']].map(x => '<option value="' + x[0] + '"' + (+o.p === x[0] ? ' selected' : '') + '>' + x[1] + '</option>').join('') + '</select></label>' +
    '<label>Show<select id="kyShow"><option value="over"' + (o.show === 'over' ? ' selected' : '') + '>Used more by target</option><option value="under"' + (o.show === 'under' ? ' selected' : '') + '>Used less by target</option></select></label>' +
    '<span class="spacer"></span><button data-act="key-export">Download CSV</button></div>' +
    '<p class="hint">The ' + DIM_LABEL[o.dim].toLowerCase() + ' filter at the top is ignored here; the other filters still apply.</p></div>';
  if (vals.length < 2) return head(title, text) + controls + '<div class="panel empty"><p>Keyness needs at least two values of ' + DIM_LABEL[o.dim].toLowerCase() + ' in the responses you are showing.</p></div>';
  const tDocs = base.filter(d => dimOf(d, o.dim) === o.target), rDocs = base.filter(d => dimOf(d, o.dim) !== o.target && (!o.ref || dimOf(d, o.dim) === o.ref));
  const res = keyness(tDocs, rDocs);
  const min = +o.min || 1, p = +o.p || 0;
  const rows = res.rows.filter(r => o.show === 'over' ? (r.over && r.a >= min) : (!r.over && r.b >= min)).filter(r => r.ll >= p).sort((a, b) => b.ll - a.ll);
  const refLabel = o.ref || 'everything else';
  return head(title, text) + controls + '<div class="panel"><h3>' + esc(o.target) + ' (' + fmt(res.c) + ' words) against ' + esc(refLabel) + ' (' + fmt(res.d) + ' words)</h3>' +
    (rows.length ? diverging(rows.slice(0, 25).map(r => ({label:r.k, v:r.lr}))) + '<p class="hint">Bars show log ratio: +1 means twice as frequent in the target, −1 half as frequent. Stars mark log-likelihood significance.</p>' +
      '<div class="tablewrap"><table class="t"><thead><tr><th>Word</th><th class="num">Target count</th><th class="num">Target per 1,000</th><th class="num">Reference count</th><th class="num">Reference per 1,000</th><th class="num">Log ratio</th><th class="num">Log-likelihood</th></tr></thead><tbody>' +
      rows.slice(0, 500).map(r => '<tr><td class="w"><button class="link" data-kwic="' + esc(r.k) + '">' + esc(r.k) + '</button></td><td class="num">' + fmt(r.a) + '</td><td class="num">' + fmt(r.pa, 2) + '</td><td class="num">' + fmt(r.b) + '</td><td class="num">' + fmt(r.pb, 2) + '</td><td class="num">' + fmt(r.lr, 2) + '</td><td class="num">' + fmt(r.ll, 2) + ' <span class="sig">' + stars(r.ll) + '</span></td></tr>').join('') + '</tbody></table></div>'
      : '<p class="hint">No words pass these settings. Lower the minimum count or relax the significance level; small samples rarely reach p &lt; .05.</p>') + '</div>';
};

/* ================= coding (layer 2) ================= */
let PENDING = null;
const codeMap = () => new Map(S.codes.map(c => [c.id, c]));

function codeLabel(c, cm){ const p = c.parent && (cm || codeMap()).get(c.parent); return p ? p.name + ' / ' + c.name : c.name; }
function newCode(name, parent){ const c = {id:'c' + uid(), name:String(name).trim(), color:PALETTE[S.codes.length % PALETTE.length], parent:parent || '', def:'', incl:'', excl:'', ex:''}; S.codes.push(c); return c; }
function anchorAll(){
  const byId = new Map(S.docs.map(d => [d.id, d]));
  for (const sg of S.segs) {
    const d = byId.get(sg.doc); if (!d) { sg._lost = true; continue; }
    prep(d);
    if (d._norm.slice(sg.s, sg.e) === sg.q) { sg._lost = false; continue; }
    const i = d._norm.indexOf(sg.q);
    if (i >= 0) { sg.s = i; sg.e = i + sg.q.length; sg._lost = false; } else sg._lost = true;
  }
}
const segsOf = id => S.segs.filter(s => s.doc === id).sort((a, b) => a.s - b.s || a.e - b.e);
function purge(){
  const ids = new Set(S.docs.map(d => d.id)), cids = new Set(S.codes.map(c => c.id));
  for (const s of S.segs) s.codes = s.codes.filter(c => cids.has(c));
  S.segs = S.segs.filter(s => ids.has(s.doc) && (s.codes.length || s.memo || s.ess));
  for (const k of Object.keys(S.wholistic)) if (!ids.has(k) || !S.wholistic[k]) delete S.wholistic[k];
  for (const k of Object.keys(S.lineNotes)) if (!ids.has(k)) delete S.lineNotes[k];

function applyCodes(ids, target){

function captureSelection(){

      (order.length ? '<div class="tray-chips" role="group" aria-label="Tap a code to apply it">' + order.map(o => '<button class="tchip" data-act="cd-applyone" data-id="' + o.c.id + '" style="--sc:' + tint(o.c.color, .22) + ';--sb:' + o.c.color + '">' + esc(o.c.name) + '</button>').join('') + '</div>' : '<p class="hint" style="margin:0">Add a code under Codes to apply first.</p>') +

function ask(message, o){

      (wantsText ? '<input id="askInput" value="' + esc(o.input) + '" aria-label="' + esc(o.label || message) + '" autocomplete="off">' : '') +
      '<div class="actions"><button type="button" data-ask="cancel">' + esc(o.cancel || 'Cancel') + '</button><button type="submit" class="' + (o.danger ? 'dangerfill' : 'primary') + '">' + esc(o.ok || 'OK') + '</button></div></form>';
    let done = false;

    dlg.querySelector('[data-ask="cancel"]').onclick = () => finish(wantsText ? null : false);
    dlg.querySelector('form').onsubmit = ev => { ev.preventDefault(); finish(wantsText ? $('#askInput').value : true); };
    dlg.oncancel = ev => { ev.preventDefault(); finish(wantsText ? null : false); };
    if (!dlg.open) { try { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); } catch (e) { dlg.setAttribute('open', ''); } }
    const f = $('#askInput') || dlg.querySelector('button[type="submit"]'); if (f) { f.focus(); if (f.select) f.select(); }

}

function setupCSV(name, txt){

function parseCSV(text){

  const first = text.split(/\r?\n/, 1)[0] || '';

    else if (c === delim) { row.push(field); field = ''; }

  }

}
